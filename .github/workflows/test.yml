name: Test calendar
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Build production image and verify isolated startup
        run: |
          docker build -t bmt-calendar:ci .
          docker run --rm -i --network none --entrypoint node bmt-calendar:ci --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { once } from "node:events";
          import { createApp } from "./server.js";
          const service = createApp({ dbPath: ":memory:", production: false, demo: false, testMode: true });
          const server = service.app.listen(0, "127.0.0.1");
          try {
            await once(server, "listening");
            const response = await fetch(`http://127.0.0.1:${server.address().port}/api/health`);
            assert.equal(response.status, 200);
            assert.equal((await response.json()).status, "ok");
            console.log("Production image startup and health passed with no external network or credentials.");
          } finally {
            await new Promise((resolve) => server.close(resolve));
            service.close();
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
